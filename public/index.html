<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>GeoGuessr LIVE — Guess the Country</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="app">

    <!-- ===== Top bar: round info + TikTok connection status ===== -->
    <header class="topbar">
      <div class="brand">🌍 <span>GeoGuess LIVE</span></div>
      <div class="round-info">
        <span id="roundNumber">Round 1</span>
        <span id="connStatus" class="pill pill-connecting">Connecting…</span>
      </div>
    </header>

    <main class="layout">

      <!-- ===== Center: the country silhouette + status message ===== -->
      <section class="stage">
        <div id="statusMessage" class="status-message">Guess the country in the comments! 🗺️</div>
        <canvas id="mapCanvas" width="600" height="480"></canvas>
        <div id="guessesLeft" class="guesses-left">6 guesses left</div>
      </section>

      <!-- ===== Right/below: guess feed ===== -->
      <section class="panel guess-panel">
        <h2>Guesses</h2>
        <div id="guessList" class="guess-list"></div>
      </section>

      <!-- ===== Leaderboard ===== -->
      <section class="panel leaderboard-panel">
        <h2>🏆 Top 10</h2>
        <ol id="leaderboardList" class="leaderboard-list"></ol>
      </section>

      <!-- ===== Live comment feed (redundant safety net alongside TikTok's own bubbles) ===== -->
      <section class="panel chat-panel">
        <h2>💬 Live Comments</h2>
        <div id="chatFeed" class="chat-feed"></div>
      </section>

    </main>

    <!-- ===== Host control bar ===== -->
    <footer class="hostbar">
      <input id="hostInput" type="text" placeholder="Type as host (guess or say something)…" />
      <button id="hostSendBtn">Send</button>
      <button id="newRoundBtn" class="host-btn">🔄 New Round</button>
      <button id="revealBtn" class="host-btn">👁 Reveal</button>
      <select id="difficultySelect" class="host-btn">
        <option value="all">All Countries</option>
        <option value="easy">Well-Known Only</option>
      </select>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="app.js"></script>
</body>
</html>
